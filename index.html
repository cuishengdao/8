<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF‑8">
<meta name="viewport" content="width=device‑width, initial‑scale=1.0">
<title>잠시 주차중입니다</title>
<style>
*{box‑sizing:border‑box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans‑serif;}
body{background:#121419;color:#ffffff;padding:40px 20px;}
.box{max‑width:440px;margin:0 auto;background:#1c2029;border‑radius:24px;padding:48px 20px;border:1px solid #333844;}
.green‑tip{color:#70dd98;font‑size:14px;text‑align:center;margin‑bottom:20px;}
.title{font‑size:36px;font‑weight:bold;text‑align:center;margin‑bottom:16px;}
.desc{color:#b0b8c4;text‑align:center;font‑size:18px;line‑height:1.8;margin‑bottom:45px;}

.buttons{display:flex;gap:18px;justify‑content:center;}
.button‑item{display:flex;flex‑direction:column;align‑items:center;}

.btn‑call{
	width:110px;height:110px;border‑radius:50%;
	background‑color:#0f2086;
	display:flex;align‑items:center;justify‑content:center;
	font‑size:40px;color:white;text‑decoration:none;
}
.btn‑sms{
	width:110px;height:110px;border‑radius:50%;
	background‑color:#222228;
	display:flex;align‑items:center;justify‑content:center;
	font‑size:40px;color:white;text‑decoration:none;
}
.btn‑emergency{
	width:110px;height:110px;border‑radius:50%;
	background‑color:#8c1c1c;
	display:flex;align‑items:center;justify‑content:center;
	font‑size:40px;color:white;text‑decoration:none;
}
.btn‑text{margin‑top:12px;font‑size:15px;color:#dddddd;}
</style>
</head>
<body>
<div class="box">
<div class="green‑tip">● 050 PRIVACY PROTECTED</div>
<div class="title">잠시 주차중입니다</div>
<div class="desc">연락이 필요할 경우<br>전화 또는 문자 부탁드립니다.</div>

<div class="buttons">
	<div class="button‑item">
<a class="btn-call" href="tel:01038370617">📞</a>
		<div class="btn‑text">전화연결</div>
	</div>
	<div class="button‑item">
		<a class="btn‑sms" href="sms:01038370617?body=안녕하세요, 차량 이동 부탁드립니다. 감사합니다.">💬</a >
		<div class="btn‑text">문자전송</div>
	</div>
	<div class="button‑item">
		<a class="btn‑emergency" href="tel:01065900999>⚠️</a >
		<div class="btn‑text">비상연락처</div>
	</div>
</div>

</div>
</body>
</html>
